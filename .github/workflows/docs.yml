name: Publish Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  publish-readthedocs:
    name: Publish to ReadTheDocs
    # Run on direct pushes to main, or when a PR into main is merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Read the Docs
        run: |
          if [ -z "${{ secrets.RTD_WEBHOOK_URL }}" ]; then
            echo "RTD_WEBHOOK_URL secret is not set! ReadTheDocs usually builds automatically via its GitHub App integration, but if you rely on this action, please set the secret."
            exit 0
          fi
          curl -X POST "${{ secrets.RTD_WEBHOOK_URL }}"
